[project]
name = "remind-me-mcp"
version = "1.33.0"
description = "Persistent, searchable memory MCP server for Claude — works across Claude.ai, Claude Code, and Claude Desktop with multi-machine sync."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Capped below 2.0 deliberately. SDK 2.0 removed `mcp.server.fastmcp`
    # outright (FastMCP -> mcp.server.mcpserver.MCPServer, no compat alias),
    # which makes every module in this package non-importable via server.py's
    # top-level import. Both the documented install path and updater.py's
    # self-update run `pip install -e .`, which ignores uv.lock and resolves
    # freely -- so an unbounded specifier means a self-update silently breaks
    # the server. The 1.x line is still maintained (1.29.0 shipped the same day
    # as 2.0.0). See docs/mcp-2.0-migration-plan.md before raising this cap.
    "mcp[cli]>=1.28,<2",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "starlette>=0.40.0",
    "uvicorn>=0.30.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
semantic = [
    "sqlite-vec>=0.1.0",
    "onnxruntime>=1.16.0",
    "tokenizers>=0.15.0",
    "huggingface-hub>=0.20.0",
]
mempalace = [
    "chromadb>=0.5.0",
]
otel = [
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
]
ann = [
    "usearch>=2.9.0",
]
all = [
    "remind-me-mcp[semantic,mempalace,otel,ann]",
]

[project.scripts]
remind-me-mcp = "remind_me_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.15,<0.16",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["remind_me_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "TCH"]
ignore = [
    "E501",    # line too long (handled by formatter, and we set 120)
]

[tool.ruff.lint.isort]
known-first-party = ["remind_me_mcp"]

[tool.mypy]
# python_version is deliberately unset so mypy targets whichever interpreter it
# runs under. Hardcoding "3.11" broke the 3.12 CI legs: numpy 2.5.1 (the version
# the lockfile selects for python_full_version >= '3.12') ships stubs using PEP
# 695 `type X = ...` statements, which mypy rejects outright when told to target
# 3.11 -- failing before it type-checks any of our code. Pinning to "3.12"
# instead would trade that for the reverse problem, letting 3.12-only syntax
# past the 3.11 leg while requires-python still claims >=3.11. The CI matrix
# already runs both 3.11 and 3.12, so leaving this unset checks each version
# against its own semantics rather than picking one and mistyping the other.
# warn_return_any disabled: sqlite3/numpy/json return values propagate as Any
# through thin wrappers (db.py, embeddings.py, vitality.py); flagging every
# return adds noise without catching real bugs here.
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["remind_me_mcp.tools", "remind_me_mcp.tools.*"]
# FastMCP's @mcp.tool(annotations=...) accepts plain dicts at runtime but the
# stubs declare ToolAnnotations | None — every tool registration (22 sites)
# would need an inline ignore otherwise.
disable_error_code = ["arg-type"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["remind_me_mcp"]
branch = false

[tool.coverage.report]
# Single source of truth for the CI coverage gate — local `pytest --cov` and
# CI both enforce the same threshold from here.
fail_under = 80
show_missing = true
precision = 2
