# Coverage gate: 80%, enforced via [tool.coverage.report] fail_under in pyproject.toml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # HUB_VERSION is a hand-maintained literal (the hub's image holds main.py and
  # nothing else, so there is nothing to derive one from at runtime). A stale
  # value is worse than none — /health, setup.sh's rollover check and
  # remind_me_sync_reconcile all report it as the deployed build. Opt out of a
  # bump with the `no-hub-version-bump` label or `[skip hub-version]` in the
  # PR body when a change genuinely alters nothing observable.
  hub-version:
    name: HUB_VERSION bump
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # The default shallow clone has no merge base to diff against.
          fetch-depth: 0

      - name: Require a HUB_VERSION bump when hub/main.py changes
        # The PR body and labels are attacker-controlled on a fork PR, so they
        # are passed as env vars — interpolating them into `run:` would be a
        # shell injection.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          python3 .github/scripts/check_hub_version.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"

  # The hub ships as its own container with its own dependencies (fastapi,
  # psycopg), neither of which is in this package's requirements — so no
  # matrix leg can even import hub/main.py, and every hub test in tests/ is a
  # static AST check. This job is the only place the hub's actual behaviour
  # runs: real Postgres, real uvicorn, real client (hub/e2e_test.py drives two
  # simulated nodes through push/pull convergence, LWW, tombstones and auth).
  # Kept separate from the matrix so the package's own legs stay
  # dependency-clean and fast.
  hub-e2e:
    name: Hub e2e (live Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: remindme
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: remindme
        ports:
          - 5444:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      HUB_TEST_URL: http://127.0.0.1:8765
      HUB_TEST_SECRET: test-secret
      HUB_TEST_DSN: postgresql://remindme:testpw@127.0.0.1:5444/remindme

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          # The hub runs from an ephemeral `uv run --with` environment that
          # exists only for this job, so there is nothing here worth pruning
          # for reuse -- and the prune runs in post-job cleanup, racing the
          # hub process this job deliberately leaves running.
          prune-cache: false

      - name: Install the client package
        run: uv sync --locked

      - name: Start the hub
        env:
          DATABASE_URL: postgresql://remindme:testpw@127.0.0.1:5444/remindme
          SYNC_SECRET: test-secret
          # On, so the e2e exercises /metrics rather than skipping it.
          REMIND_ME_HUB_METRICS_ENABLED: "1"
        working-directory: hub
        run: |
          # --with, not a lockfile entry: these are the hub image's
          # dependencies, deliberately absent from this package's own.
          nohup uv run \
            --with "fastapi>=0.115,<1" \
            --with "uvicorn[standard]>=0.30,<1" \
            --with "psycopg[binary]>=3.2,<4" \
            uvicorn main:app --host 127.0.0.1 --port 8765 > /tmp/hub.log 2>&1 &
          echo $! > /tmp/hub.pid
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8765/health >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "hub did not become healthy"; cat /tmp/hub.log; exit 1

      - name: Run the hub end-to-end suite
        env:
          # A fresh runner has no /tmp/node-*; wiping keeps a re-run on a
          # warm/self-hosted runner honest instead of silently reusing state.
          E2E_WIPE: "1"
        working-directory: hub
        run: uv run --with "psycopg[binary]>=3.2,<4" python e2e_test.py

      - name: Hub log
        if: failure()
        run: cat /tmp/hub.log

      # A job must not leave running what it started. Beyond hygiene, the
      # orphaned `uv run` wrapper outlives every step and collides with
      # post-job cleanup, which is a 5-minute hang and a failed job long
      # after the suite itself has passed.
      - name: Stop the hub
        if: always()
        run: |
          [ -f /tmp/hub.pid ] && kill "$(cat /tmp/hub.pid)" 2>/dev/null || true
          pkill -f "uvicorn main:app" 2>/dev/null || true
          exit 0

  ci:
    name: Python ${{ matrix.python-version }} (${{ matrix.extras }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        # "semantic" = full install with sqlite-vec/onnxruntime extras;
        # "base" = plain install — the README's default path; vec/onnx tests importorskip.
        extras: [semantic, base]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies from uv.lock (dev group included by default)
        run: |
          if [ "${{ matrix.extras }}" = "semantic" ]; then
            uv sync --locked --extra semantic
          else
            uv sync --locked
          fi

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Type check
        run: uv run mypy remind_me_mcp

      # The 80% gate (pyproject [tool.coverage.report] fail_under) applies to the
      # full install only — the base leg skips sqlite-vec/onnx tests via importorskip,
      # so its coverage is structurally lower; it still must pass the whole suite.
      - name: Test with coverage
        run: |
          if [ "${{ matrix.extras }}" = "semantic" ]; then
            uv run pytest --cov=remind_me_mcp --cov-report=term-missing
          else
            uv run pytest --cov=remind_me_mcp --cov-report=term-missing --cov-fail-under=0
          fi
