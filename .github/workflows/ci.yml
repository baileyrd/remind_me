# Coverage gate: 80%, enforced via [tool.coverage.report] fail_under in pyproject.toml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # HUB_VERSION is a hand-maintained literal (the hub's image holds main.py and
  # nothing else, so there is nothing to derive one from at runtime). A stale
  # value is worse than none — /health, setup.sh's rollover check and
  # remind_me_sync_reconcile all report it as the deployed build. Opt out of a
  # bump with the `no-hub-version-bump` label or `[skip hub-version]` in the
  # PR body when a change genuinely alters nothing observable.
  hub-version:
    name: HUB_VERSION bump
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # The default shallow clone has no merge base to diff against.
          fetch-depth: 0

      - name: Require a HUB_VERSION bump when hub/main.py changes
        # The PR body and labels are attacker-controlled on a fork PR, so they
        # are passed as env vars — interpolating them into `run:` would be a
        # shell injection.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          python3 .github/scripts/check_hub_version.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"

  ci:
    name: Python ${{ matrix.python-version }} (${{ matrix.extras }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        # "semantic" = full install with sqlite-vec/onnxruntime extras;
        # "base" = plain install — the README's default path; vec/onnx tests importorskip.
        extras: [semantic, base]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies from uv.lock (dev group included by default)
        run: |
          if [ "${{ matrix.extras }}" = "semantic" ]; then
            uv sync --locked --extra semantic
          else
            uv sync --locked
          fi

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Type check
        run: uv run mypy remind_me_mcp

      # The 80% gate (pyproject [tool.coverage.report] fail_under) applies to the
      # full install only — the base leg skips sqlite-vec/onnx tests via importorskip,
      # so its coverage is structurally lower; it still must pass the whole suite.
      - name: Test with coverage
        run: |
          if [ "${{ matrix.extras }}" = "semantic" ]; then
            uv run pytest --cov=remind_me_mcp --cov-report=term-missing
          else
            uv run pytest --cov=remind_me_mcp --cov-report=term-missing --cov-fail-under=0
          fi
